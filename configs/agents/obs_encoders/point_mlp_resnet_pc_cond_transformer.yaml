_target_: agents.encoders.point_mlp_resnet_transformer_encoder.PointMLPResNetEncoder
_recursive_: false

pc_emb_as_cond: True
img_emb_as_cond: False

point_mlp_encoder:
  _target_: agents.encoders.point_mlp_2_encoder.PointMLPEncoder
  _recursive_: false

  use_pc_color: ${use_pc_color}
  out_channels: ${latent_dim}
  use_layer_norm: ${use_layer_norm}
  use_final_layer_norm: ${use_final_layer_norm}
  use_max_pool: ${use_max_pool}

resnet_encoder:
  _target_: agents.encoders.multi_image_obs_encoder.MultiImageObsEncoder
  _recursive_: false

  shape_meta: ${shape_meta}

  rgb_model:
    _target_: agents.encoders.pretrained_resnets.FiLMResNet18Policy
    condition_dim: ${goal_dim}

  resize_shape: null
  #    crop_shape: [ 84, 84 ]
  # constant center crop
  random_crop: False
  use_group_norm: True
  share_rgb_model: False
  imagenet_norm: True

attn_model:
  _target_: agents.backbones.transformer.blocks.TransformerEncoder
  _recursive_: false

  embed_dim: ${latent_dim}
  n_heads: 8
  n_layers: 4
  attn_pdrop: 0.3
  resid_pdrop: 0.1
  mlp_pdrop: 0.1
  bias: False

latent_dim: ${latent_dim}