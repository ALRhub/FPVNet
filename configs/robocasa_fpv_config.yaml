defaults:
  - agents: beso_agent
  - trainers: base_trainer
  # - override hydra/launcher: "submitit_slurm"

agent_name: beso
log_dir: logs/${env_group}/

# insert wandb here
wandb:
  entity: tiger_or_cat
  project: atalay_robocasa_final
  group: ${env_group}
  mode: disabled 
  # mode: online

hydra:
  mode: MULTIRUN # needed for launcher to be used
  run:
    dir: ${log_dir}/runs/${agent_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: True
  sweep:
    dir: ${log_dir}/sweeps/${agent_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
  # launcher:
  #   account: hk-project-sustainebot
  #   timeout_min: 900
  #   name: robocasa #${hydra.job.name}
  #   partition: accelerated
  #   gres: gpu:1

env_group: doors
seed: 42
camera_names:
  - "robot0_agentview_left"
  - "robot0_agentview_right"
  - "robot0_eye_in_hand"
num_cameras: 3

# Model Setting
window_size: ${add:${obs_seq_len},${pred_seq_len},-1}
obs_seq_len: 1
act_seq_len: 10
pred_seq_len: 10
multistep: ${window_size} # only for inference, could be different from act_seq_len
goal_window_size: 1

goal_conditioned: True

# Training
train_batch_size: 256
num_workers: 16
pin_memory: True
device: "cuda"
epoch: 100
scale_data: True
scaler_type: "minmax"

if_use_ema: True

## Environment
obs_dim: 8
action_dim: 7

use_pc_color: False

obs_tokens: ${pc_num_group}

## Observations
if_film_condition: False
if_robot_states: False
img_width: 128
img_height: 128
shape_meta:
  # acceptable types: rgb, low_dim
  obs:
    robot0_eye_in_hand_image:
      shape:
        - 3
        - ${img_height}
        - ${img_width}
      type: rgb
    robot0_agentview_left_image:
      shape:
        - 3
        - ${img_height}
        - ${img_width}
      type: rgb
    robot0_agentview_right_image:
      shape:
        - 3
        - ${img_height}
        - ${img_width}
      type: rgb

##########################################################################################
# Common Parameters
##########################################################################################
n_embd: 128
goal_dim: 512
latent_dim: 512

##########################################################################################
# Transformer Parameters (encoder-decoder)
##########################################################################################
encoder_n_layer: 6
decoder_n_layer: 6
n_heads: 8
use_pos_emb: False

##########################################################################################
# Diffusion Parameters
##########################################################################################
condition_on_diffusion_timestep: False

##########################################################################################
# Point MLP Parameters
##########################################################################################
use_layer_norm: true
use_final_layer_norm: true
use_max_pool: true

pc_num_group: 256
pc_group_size: 32
sampled_pc_size: 4096
normalize_neighborhood: False

##########################################################################################
# SUGAR
##########################################################################################
unfreeze_last_n_layers: 6

trainset:
  _target_: environments.dataset.robocasa_fpv_dataset.RobocasaDataset
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  cam_names: ${camera_names}
  device: cpu
  window_size: ${window_size}
  obs_seq_len: ${obs_seq_len}
  img_width: ${img_width}
  img_height: ${img_height}
  env_group: ${env_group}
  pc_num_group: ${pc_num_group}
  pc_group_size: ${pc_group_size}
  sampled_pc_size: ${sampled_pc_size}
  use_pc_color: ${use_pc_color}
  normalize_neighborhood: ${normalize_neighborhood}

simulation:
  _target_: simulation.robocasa_fpv_sim.RoboCasaSim
  env_group: ${env_group}
  camera_names: ${camera_names}
  seed: ${seed}
  device: ${device}
  img_height: ${img_height}
  img_width: ${img_width}
  num_episode: 50
  render: False
  if_vision: True
  use_pc_color: ${use_pc_color}
  pc_num_group: ${pc_num_group}
  pc_group_size: ${pc_group_size}
  sampled_pc_size: ${sampled_pc_size}
